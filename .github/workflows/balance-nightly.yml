name: Balance Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

jobs:
  slow-balance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Slow Balance Check
        run: npm run balance-check -- --runs=500
