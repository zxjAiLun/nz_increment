name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-build-balance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      # 与本地封板标准对齐：默认 1000 runs/点，同时校验
      # (1) guardrail 0 fail；(2) 当前代码生成结果与已提交 reports/balance-report.md 逐字节一致。
      # --verify 模式只在内存中生成并对比，不写回报告，因此无法靠提前改写报告掩盖 stale report。
      - name: Balance Report Verify (strict, 1000 runs)
        run: npm run balance-report:verify -- --check
