name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-build-balance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      # Phase 3.32：Bundle Budget 硬门——锁定 Phase 3.31 拆包成果。
      # 入口 raw ≤ 400kB / gzip ≤ 140kB、非入口 chunk ≤ 200kB、异步 chunk ≥ 15 个；
      # 任何静态 import 回流导致入口膨胀都会令 CI 失败。
      - name: Bundle Budget
        run: npm run bundle-budget

      # Phase 3.32 修复轮（P1）：README 记录的子路径部署（VITE_BASE_PATH=/game/）
      # 构建的 index.html 入口 src 带 /game/ 前缀，但 JS 文件仍位于 dist/assets/。
      # 独立烟测验证 Bundle Budget 对非根 base 的解析（同样不可 continue-on-error）。
      - name: Subpath Build
        env:
          VITE_BASE_PATH: /game/
        run: npm run build

      - name: Subpath Bundle Budget
        run: npm run bundle-budget

      # 与本地封板标准对齐：默认 1000 runs/点，同时校验
      # (1) guardrail 0 fail；(2) 当前代码生成结果与已提交 reports/balance-report.md 逐字节一致。
      # --verify 模式只在内存中生成并对比，不写回报告，因此无法靠提前改写报告掩盖 stale report。
      - name: Balance Report Verify (strict, 1000 runs)
        run: npm run balance-report:verify -- --check
